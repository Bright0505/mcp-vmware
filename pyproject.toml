[project]
name = "mcp-vmware"
version = "0.2.1"
description = "Read-only MCP server for VMware vCenter (vSphere REST + PerformanceManager)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bright0505", email = "bright.su72@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0",
    "httpx2>=2.5.0",
    "pydantic>=2.12.0",
    # HTTP 模式(Streamable HTTP + Bearer/OAuth 驗證)
    "uvicorn[standard]>=0.30.0",
    "PyJWT[crypto]>=2.8.0",
    # VM 歷史效能數據(vCenter 7 REST 無效能端點,走 SOAP PerformanceManager)
    "pyvmomi>=8.0.1",
    # zoneinfo 的時區資料(slim 映像檔可能沒有系統 tzdata)
    "tzdata>=2024.1",
]

[project.scripts]
mcp-vmware = "mcp_vmware.__main__:main"
mcp-vmware-http = "http_server:run_http_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vmware"]
